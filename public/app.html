<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeaveSync - Smart Leave Permission System</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><i>🎓</i><div>LeaveSync<small id="portal">Portal</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-user">
      <div class="who"><div class="avatar" id="avatar">A</div><div><b id="sName"></b><small id="sEmail"></small></div></div>
      <button class="signout" id="signout">⎋ &nbsp;Sign Out</button>
      <div style="font-size:11.5px;padding:8px 14px 0;color:var(--muted)"><a href="/privacy.html" target="_blank">Privacy</a> · <a href="/terms.html" target="_blank">Terms</a></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu">☰</button>
      <div class="search"><input id="search" placeholder="🔍  Search requests..."></div>
      <div class="top-actions">
        <button class="icon-btn" id="theme" title="Dark mode">🌙</button>
        <button class="icon-btn" id="bell" title="Notifications">🔔<span class="dot hidden" id="bellDot">0</span></button>
        <div style="text-align:right"><b id="tName"></b><br><span class="role-tag" id="tRole"></span></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
